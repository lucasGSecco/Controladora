<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Uniserv Voucher App</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container flex-center">
    <header class="text-center">
      <h1>Vouchers de Internet</h1>
      <p class="subtitle">Gerenciamento via UniFi Network Application</p>
    </header>

    <section class="card login-card">
      <h2>Acessar o Painel</h2>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuário UniFi</label>
          <input
            type="text"
            id="username"
            placeholder="Digite seu usuário"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary full-width">Entrar</button>
        </div>
      </form>

      <p id="login-feedback" class="feedback text-center"></p>
    </section>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
